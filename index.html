<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eyad Aly — 3D Luxury Portfolio & Analytics Studio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <!-- Three.js & Loaders -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    body { margin: 0; overflow: hidden; background: #020617; font-family: 'Inter', sans-serif; color: #f8fafc; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="relative w-screen h-screen select-none">

  <!-- 3D Canvas Container -->
  <div id="canvas-container" class="absolute inset-0 w-full h-full z-0"></div>

  <!-- Top Navigation HUD -->
  <header class="absolute top-0 left-0 right-0 z-30 p-4 md:p-6 flex flex-wrap items-center justify-between gap-4 pointer-events-none">
    <div class="pointer-events-auto bg-slate-950/80 backdrop-blur-md border border-slate-800 px-4 py-2.5 rounded-xl flex items-center space-x-3 shadow-lg">
      <div class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse"></div>
      <span class="mono text-sm font-bold tracking-widest uppercase text-white">Eyad Aly</span>
    </div>

    <nav class="pointer-events-auto bg-slate-950/80 backdrop-blur-md border border-slate-800 p-1.5 rounded-xl flex flex-wrap gap-1 shadow-lg">
      <button onclick="navigate('hero')" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-sky-500 text-slate-950 transition" id="btn-hero">Studio</button>
      <button onclick="navigate('dashboard')" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition" id="btn-dashboard">Monitor Dashboard</button>
      <button onclick="navigate('about')" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition" id="btn-about">Biography</button>
      <button onclick="navigate('experience')" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition" id="btn-experience">Experience</button>
      <button onclick="navigate('skills')" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition" id="btn-skills">Skills</button>
      <button onclick="navigate('projects')" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition" id="btn-projects">Projects</button>
      <button onclick="navigate('cv')" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition" id="btn-cv">CV</button>
      <button onclick="navigate('contact')" class="nav-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition" id="btn-contact">Contact</button>
    </nav>
  </header>

  <!-- Bottom Status HUD -->
  <div class="absolute bottom-6 left-6 right-6 z-30 flex items-center justify-between pointer-events-none">
    <div class="pointer-events-auto bg-slate-950/80 backdrop-blur-md border border-slate-800 px-4 py-3 rounded-xl shadow-lg">
      <div class="mono text-[10px] text-slate-400 uppercase tracking-wider">Active Viewpoint</div>
      <div id="view-label" class="text-sm font-semibold text-sky-400">Luxury Studio Overview</div>
    </div>
    <div class="hidden md:block pointer-events-auto bg-slate-950/80 backdrop-blur-md border border-slate-800 px-4 py-3 rounded-xl text-xs text-slate-300">
      💡 Drag to orbit • Scroll to zoom • Click 3D Monitor or top buttons to explore
    </div>
  </div>

  <!-- Interactive Modal Overlay -->
  <div id="modal-overlay" class="hidden absolute inset-4 md:inset-14 z-40 bg-slate-900/95 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/60">
      <span id="modal-title" class="mono text-xs uppercase tracking-widest text-sky-400 font-semibold">Eyad Aly — Executive Studio</span>
      <button onclick="navigate('hero')" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-rose-900/60 text-slate-300 hover:text-white text-xs font-semibold transition">✕ Close</button>
    </div>
    <div id="modal-body" class="flex-1 overflow-y-auto p-6 md:p-10 space-y-6"></div>
  </div>

  <!-- 3D & UI Logic Script -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#020617');
    scene.fog = new THREE.FogExp2('#020617', 0.04);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.2, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;
    controls.minDistance = 1.5;
    controls.maxDistance = 14;

    // Professional Studio Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(6, 12, 8);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const accentLight = new THREE.PointLight(0x38bdf8, 2, 12);
    accentLight.position.set(-2, 2.5, -1);
    scene.add(accentLight);

    // Procedural Fallback Workspace (Visible instantly while GLB loads)
    const fallbackGroup = new THREE.Group();
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4, metalness: 0.2 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1;
    floor.receiveShadow = true;
    scene.add(floor);

    const desk = new THREE.Mesh(
      new THREE.BoxGeometry(3.2, 0.12, 1.4),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.2, metalness: 0.5 })
    );
    desk.position.set(0, -0.1, 0);
    desk.castShadow = true;
    fallbackGroup.add(desk);

    const monitorScreen = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 0.85, 0.05),
      new THREE.MeshStandardMaterial({ color: 0x0284c7, emissive: 0x0369a1, emissiveIntensity: 0.5, roughness: 0.1 })
    );
    monitorScreen.position.set(0, 0.55, -0.2);
    monitorScreen.name = "ComputerMonitor";
    fallbackGroup.add(monitorScreen);
    scene.add(fallbackGroup);

    // Load luxury_office_studio-v2.glb from the same folder
    const loader = new GLTFLoader();
    loader.load(
      './luxury_office_studio-v2.glb',
      (gltf) => {
        scene.remove(fallbackGroup);
        gltf.scene.position.set(0, -1, 0);
        gltf.scene.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        scene.add(gltf.scene);
      },
      undefined,
      (err) => console.log('Using procedural studio environment fallback:', err)
    );

    // Camera Navigation Viewpoints
    const targetCamPos = new THREE.Vector3(0, 2.2, 6);
    const targetLookAt = new THREE.Vector3(0, 0.3, 0);

    const VIEWS = {
      hero: { pos: [0, 2.2, 6], look: [0, 0.3, 0], label: 'Luxury Studio Overview' },
      dashboard: { pos: [0, 0.8, 1.8], look: [0, 0.55, -0.2], label: 'Executive Analytics Monitor' },
      about: { pos: [-2.8, 1.6, 3.2], look: [0, 0.3, 0], label: 'Biography & Executive Profile' },
      experience: { pos: [2.8, 1.8, 3.2], look: [0, 0.3, 0], label: 'Professional Experience' },
      skills: { pos: [0, 3.2, 4.2], look: [0, 0.2, 0], label: 'Technical Skills & Stack' },
      projects: { pos: [-2.2, 2.0, -2.8], look: [0, 0.2, 0], label: 'Featured Enterprise Projects' },
      cv: { pos: [2.2, 2.0, 2.5], look: [0, 0.4, 0], label: 'Curriculum Vitae' },
      contact: { pos: [2.5, 1.8, -2.5], look: [0, 0.2, 0], label: 'Executive Contact Channel' }
    };

    // Raycaster for clicking 3D monitor in the scene
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    window.addEventListener('click', (e) => {
      if (e.target !== renderer.domElement) return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);
      if (intersects.length > 0) {
        const name = (intersects[0].object.name || '').toLowerCase();
        if (name.includes('monitor') || name.includes('screen') || intersects[0].object === monitorScreen) {
          window.navigate('dashboard');
        }
      }
    });

    // Render loop with smooth camera lerping
    function animate() {
      requestAnimationFrame(animate);
      camera.position.lerp(targetCamPos, 0.05);
      controls.target.lerp(targetLookAt, 0.05);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Interactive Business Simulator Handler
    window.simMult = 1.25;
    window.updateSim = (val) => {
      window.simMult = parseFloat(val);
      const simValEl = document.getElementById('sim-val');
      const arrValEl = document.getElementById('arr-val');
      if (simValEl) simValEl.innerText = window.simMult.toFixed(2) + 'x';
      if (arrValEl) arrValEl.innerText = '$' + Math.round(142850 * window.simMult).toLocaleString();
    };

    // Modal Content Templates for Eyad Aly
    const CONTENT = {
      dashboard: () => `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-slate-800/60 border border-slate-700 p-5 rounded-xl">
            <div class="text-xs text-slate-400 uppercase">Simulated ARR</div>
            <div id="arr-val" class="text-2xl font-bold text-emerald-400 mt-2">$${Math.round(142850 * window.simMult).toLocaleString()}</div>
            <div class="text-xs text-slate-400 mt-1">+24.8% YoY Synthetic Growth</div>
          </div>
          <div class="bg-slate-800/60 border border-slate-700 p-5 rounded-xl">
            <div class="text-xs text-slate-400 uppercase">Active Automation Pipelines</div>
            <div class="text-2xl font-bold text-sky-400 mt-2">1,248</div>
            <div class="text-xs text-slate-400 mt-1">99.98% System Uptime</div>
          </div>
          <div class="bg-slate-800/60 border border-slate-700 p-5 rounded-xl">
            <div class="text-xs text-slate-400 uppercase">Latency Overhead</div>
            <div class="text-2xl font-bold text-amber-400 mt-2">14.2 ms</div>
            <div class="text-xs text-slate-400 mt-1">Real-time Telemetry</div>
          </div>
        </div>
        <div class="bg-slate-800/40 border border-slate-700 p-6 rounded-xl mt-6">
          <label class="text-xs text-slate-300 uppercase font-semibold block mb-3">
            Interactive Business Scaling Simulator: <span id="sim-val" class="text-sky-400 font-bold">${window.simMult}x</span>
          </label>
          <input type="range" min="0.5" max="3.0" step="0.05" value="${window.simMult}" oninput="window.updateSim(this.value)" class="w-full accent-sky-400 cursor-pointer" />
        </div>
      `,
      about: () => `
        <h2 class="text-2xl font-bold text-white">Eyad Aly — Senior Solutions Architect</h2>
        <p class="text-slate-300 leading-relaxed">Senior technology engineer and solutions architect specializing in high-throughput enterprise automation, full-stack 3D WebGL applications, distributed cloud systems, and real-time operational analytics.</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4">
          <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl"><b class="text-sky-400">Enterprise Architecture</b><p class="text-xs text-slate-400 mt-1">Scalable microservices and data pipelines handling millions of synthetic events.</p></div>
          <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl"><b class="text-sky-400">3D Web & Interactive UX</b><p class="text-xs text-slate-400 mt-1">Photorealistic Three.js and WebGL experiences with smooth camera physics.</p></div>
        </div>
      `,
      experience: () => `
        <div class="space-y-4">
          <div class="bg-slate-800/50 border border-slate-700 p-5 rounded-xl">
            <div class="flex justify-between"><b class="text-white">Principal Systems Architect</b><span class="text-xs text-sky-400">2023 — Present</span></div>
            <p class="text-xs text-slate-400 mt-2">Architected real-time event-driven data streaming layers and enterprise workflow automation engines.</p>
          </div>
          <div class="bg-slate-800/50 border border-slate-700 p-5 rounded-xl">
            <div class="flex justify-between"><b class="text-white">Senior Full-Stack & 3D Web Engineer</b><span class="text-xs text-sky-400">2021 — 2023</span></div>
            <p class="text-xs text-slate-400 mt-2">Developed interactive 3D WebGL visualizers and executive analytics dashboards.</p>
          </div>
        </div>
      `,
      skills: () => `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-slate-800/50 border border-slate-700 p-5 rounded-xl"><b class="text-sky-400">Engineering</b><p class="text-xs text-slate-300 mt-2">TypeScript, React, Node.js, Python, Go</p></div>
          <div class="bg-slate-800/50 border border-slate-700 p-5 rounded-xl"><b class="text-sky-400">3D & WebGL</b><p class="text-xs text-slate-300 mt-2">Three.js, React Three Fiber, GLSL, Blender</p></div>
          <div class="bg-slate-800/50 border border-slate-700 p-5 rounded-xl"><b class="text-sky-400">Cloud & DevOps</b><p class="text-xs text-slate-300 mt-2">AWS, Docker, Kubernetes, Render, CI/CD</p></div>
        </div>
      `,
      projects: () => `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-slate-800/50 border border-slate-700 p-5 rounded-xl"><b class="text-white">Autonomous Workflow Engine</b><p class="text-xs text-slate-400 mt-2">Distributed engine processing 25,000+ synthetic jobs/sec.</p></div>
          <div class="bg-slate-800/50 border border-slate-700 p-5 rounded-xl"><b class="text-white">Lumen 3D Executive Studio</b><p class="text-xs text-slate-400 mt-2">Luxury WebGL workspace with real-time business simulations.</p></div>
        </div>
      `,
      cv: () => `
        <div class="flex justify-between items-center"><h3 class="text-lg font-bold">Eyad Aly — Curriculum Vitae</h3><button onclick="window.print()" class="px-4 py-2 bg-sky-500 text-slate-950 text-xs font-bold rounded-lg">Print / Export PDF</button></div>
        <p class="text-sm text-slate-300 mt-4">B.Sc. in Computer Science & Engineering • AWS Certified Solutions Architect • Certified Kubernetes Administrator (CKA)</p>
      `,
      contact: () => `
        <div class="max-w-md mx-auto space-y-4">
          <h3 class="text-lg font-bold text-white">Direct Executive Inquiry — Eyad Aly</h3>
          <input type="text" placeholder="Your Name" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm" />
          <input type="email" placeholder="Your Email" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm" />
          <textarea rows="4" placeholder="Message" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-2.5 text-sm"></textarea>
          <button onclick="alert('Message sent to Eyad Aly!')" class="w-full py-3 bg-sky-500 text-slate-950 font-bold text-xs uppercase rounded-lg">Send Inquiry</button>
        </div>
      `
    };

    window.navigate = (section) => {
      const v = VIEWS[section] || VIEWS.hero;
      targetCamPos.set(...v.pos);
      targetLookAt.set(...v.look);
      document.getElementById('view-label').innerText = v.label;

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.className = 'nav-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-800 transition';
      });
      const activeBtn = document.getElementById('btn-' + section);
      if (activeBtn) activeBtn.className = 'nav-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-sky-500 text-slate-950 transition';

      const modal = document.getElementById('modal-overlay');
      if (section === 'hero') {
        modal.classList.add('hidden');
      } else {
        document.getElementById('modal-title').innerText = 'Eyad Aly — ' + v.label;
        document.getElementById('modal-body').innerHTML = CONTENT[section] ? CONTENT[section]() : '';
        modal.classList.remove('hidden');
      }
    };
  </script>
</body>
</html>
